# Keeps the pinned actions current. Every action the workflows use is pinned to a full
# commit SHA with its version in a comment, because a tag can be moved to different code
# after the fact and a commit cannot. Dependabot reads that form and proposes the new SHA
# and version together, so pinning never turns into falling behind.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
