name: Test

# The build and test matrix, shared by every workflow that must prove a commit before
# acting on it: pull requests, and Deploy before it promotes anything. One definition,
# so the gate a release passes cannot drift from the gate a pull request passes.
#
# Linux, Windows and macOS, each on x86_64 and on arm64, always. Behaving identically
# everywhere is this tool's central claim, so a change that passes on one runner and fails
# on another is a real defect, not a CI quirk. Every leg runs on a native runner rather
# than under emulation: .NET is not supported under QEMU, so an emulated leg could fail,
# or pass, for reasons that have nothing to do with the code.
#
# Every action is pinned to a full commit SHA; see docs/releasing.md.

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit to test. Defaults to the commit the calling workflow runs for."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      # Every platform's result is wanted. Cancelling the others on the first failure
      # hides whether a break is platform specific, which is exactly the question this
      # matrix exists to answer.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest           # Linux x86_64
          - ubuntu-24.04-arm        # Linux arm64
          - windows-latest          # Windows x86_64
          - windows-11-vs2026-arm   # Windows arm64
          - macos-26-intel          # macOS x86_64
          - macos-latest            # macOS arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          # Nothing here pushes, so no credential is left in the working copy for the
          # code under test to find.
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore RepoHarness.slnx

      - name: Build
        # Warnings are errors and NuGet auditing is on, so a newly disclosed advisory
        # against a pinned dependency fails here rather than shipping.
        run: dotnet build RepoHarness.slnx --configuration Release --no-restore

      - name: Test
        # The suite's own binary, which exits non-zero when any test fails. Run directly, it
        # says what dotnet test keeps to itself: each test still running after two minutes,
        # named again every two minutes it runs on, and the slowest tests once the run ends.
        # And it is stopped short of the job's own limit: a job that limit ended kept no log,
        # so nothing said which test had hung.
        timeout-minutes: 15
        run: dotnet build/bin/repo-harness-test/release/repo-harness-test.dll --xunit-diagnostics on --long-running 120 --show-slowest-tests 20
