name: Diagnose Deploy's push

# TEMPORARY, removed before this pull request merges. Deploy's push to main and release/beta was
# refused with HTTP 403 for daily-software-deploy[bot]. Since then, dry runs and real pushes with a
# token minted exactly as Deploy mints it were allowed in every shape tried one at a time. This round
# replays Deploy's push as a single push: a new commit on main's head, pushed atomically to a stand-in
# for main and to a ruleset-protected release branch no channel uses, which moves over the workflow
# changes from the commit the release branches still point at. The stand-ins exist only for the
# test and are deleted at its end, and nothing that publishes starts on them. It prints no token.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Token exactly as Deploy mints it
        id: as-deploy
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DSS_DEPLOY_APP_ID }}
          private-key: ${{ secrets.DSS_DEPLOY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Replay Deploy's push
        env:
          APP_TOKEN: ${{ steps.as-deploy.outputs.token }}
          MAIN_SHA: c32f0cb103559c851611c1ebe86cae5b2a181b03
          RELEASE_BASE: f993229e268d
        run: |
          # Every step runs and reports, whatever the one before it answered.
          set +e
          set -uo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          basic=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)
          echo "::add-mask::$basic"

          push() {
            GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic" \
              git push "$@" 2>&1
          }

          main_standin=bugfix/deploy-push-probe-main
          release_standin=release/rc

          # The version bump Deploy commits, on top of the commit main points at.
          git checkout --quiet --detach "$MAIN_SHA"
          echo "probe" > deploy-push-probe.txt
          git add deploy-push-probe.txt
          git commit --quiet -m "v0.0.0-probe"
          promoted=$(git rev-parse HEAD)

          push origin "$MAIN_SHA:refs/heads/$main_standin"
          echo "RESULT setup $main_standin at main's commit: exit $?"
          push origin "$RELEASE_BASE:refs/heads/$release_standin"
          echo "RESULT setup $release_standin at the release branches' commit: exit $?"

          push --atomic origin "$promoted:refs/heads/$main_standin" "$promoted:refs/heads/$release_standin"
          echo "RESULT replay of Deploy's atomic push: exit $?"

          for ref in "$main_standin" "$release_standin"; do
            push origin --delete "refs/heads/$ref"
            echo "cleanup $ref: exit $?"
          done
