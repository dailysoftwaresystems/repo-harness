name: Deploy

# Version bump, branch promotion, and the start of publishing. Nothing published is built
# here: once a release branch has moved, this starts pipeline-pkg for it, which owns
# packing, publishing, tagging and the GitHub release. Keeping that boundary means
# re-running one phase never half-performs the other.
#
# Nothing moves until the commit has passed the test matrix, and only what passed it moves:
# the commit is pinned before testing, so a push to the source branch while the matrix runs
# cannot slip an untested commit into a release. stable promotes the tested commit itself;
# beta promotes the version bump on top of it, which changes nothing but <Version>.
#
# repo-harness ships as an app: people install the released tool rather than build on
# it, so it uses two channels, main -> release/beta -> release/stable. beta publishes each
# new version as a prerelease; stable publishes, under the bare version, the commit beta
# already published.
#
# Credentials: the organisation's rulesets protect main and the release branches and let its
# deploy GitHub App push to them, and the organisation provides that app's credentials to
# every repository. The push alone uses a short-lived token minted from them, for this
# repository alone and for its contents alone; everything else runs with the GITHUB_TOKEN
# it is handed. Nothing is stored in this repository, which is PUBLIC: it deliberately
# does not call the reusable workflows in the private DevOps repository and never uses
# `secrets: inherit`. Every action is pinned to a full commit SHA; see docs/releasing.md.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Deploy channel"
        required: true
        type: choice
        options:
          - beta
          - stable
      version:
        description: "New version, beta channel only (default: bump the patch)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # One promotion at a time: two runs at once would race on the same branches. Runs started
  # meanwhile wait in the order they started; by default a newer waiting run would cancel an
  # older one instead.
  group: deploy
  queue: max

env:
  PROJECT: src/RepoHarness.Cli/RepoHarness.Cli.csproj

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source: ${{ steps.plan.outputs.source }}
      target: ${{ steps.plan.outputs.target }}
      sha: ${{ steps.plan.outputs.sha }}

    steps:
      - name: Validate the request and pin the commit to promote
        id: plan
        env:
          CHANNEL: ${{ inputs.channel }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          case "$CHANNEL" in
            beta)   source=main;         target=release/beta ;;
            stable) source=release/beta; target=release/stable ;;
            *)      echo "::error::Unknown channel '$CHANNEL'."; exit 1 ;;
          esac

          if [ "$CHANNEL" = "beta" ] && [ "$REF_NAME" != "main" ]; then
            echo "::error::The beta channel is cut from main, not $REF_NAME."
            exit 1
          fi

          if [ "$CHANNEL" != "beta" ] && [ -n "$REQUESTED_VERSION" ]; then
            echo "::error::An explicit version is only accepted on the beta channel."
            echo "::error::stable promotes exactly what beta already published."
            exit 1
          fi

          # A branch that does not exist is told apart from a lookup that failed: "could not
          # tell" is not "does not exist".
          errors="$RUNNER_TEMP/branch-lookup.err"
          if ! sha=$(gh api "repos/$REPOSITORY/branches/$source" --jq '.commit.sha' 2>"$errors"); then
            if grep -q "HTTP 404" "$errors"; then
              echo "::error::Source branch '$source' does not exist, so there is nothing to promote."
            else
              echo "::error::Could not read source branch '$source', so nothing was promoted: $(cat "$errors")"
            fi
            exit 1
          fi

          # The pinned commit is what gets tested and promoted; an empty one would let the
          # checkout fall back to another commit.
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Reading source branch '$source' gave '$sha', not a commit."
            exit 1
          fi

          {
            echo "source=$source"
            echo "target=$target"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

          echo "Will promote $source at $sha to $target once it passes the test matrix."

  test:
    needs: plan
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}

  promote:
    name: promote
    needs: [plan, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The GITHUB_TOKEN reads, and starts pipeline-pkg. The push alone carries the deploy app's token.
    permissions:
      contents: read
      actions: write

    env:
      CHANNEL: ${{ inputs.channel }}
      SOURCE: ${{ needs.plan.outputs.source }}
      TARGET: ${{ needs.plan.outputs.target }}
      TESTED_SHA: ${{ needs.plan.outputs.sha }}

    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          # No credential is left in the working copy for the steps below. The repository is
          # public, so the fetches they make need none.
          persist-credentials: false

      - name: Setup .NET
        # The version script is a C# file-based app, so the release path needs no
        # language this repository does not already depend on.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check the promotion before anything is committed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Every check that can refuse the release runs before the bump is committed, so a
          # refusal leaves main and both release branches exactly as they were. Branches and
          # tags are read as they are now, not as the checkout found them.
          git fetch --quiet --prune origin "+refs/heads/*:refs/remotes/origin/*" "+refs/tags/*:refs/tags/*"
          errors="$RUNNER_TEMP/check.err"

          # A publish that has not finished, or still waits for approval, would be overtaken:
          # moving its branch on can leave its version tagged, or on nuget.org, with nothing left
          # to release it. stable also waits for a beta publish it may be about to promote.
          branches=("$TARGET")
          if [ "$CHANNEL" = "stable" ]; then
            branches+=("$SOURCE")
          fi

          for branch in "${branches[@]}"; do
            if ! running=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pipeline-pkg.yml --branch "$branch" \
                --limit 100 --json status --jq '[.[] | select(.status != "completed")] | length' 2>"$errors"); then
              echo "::error::Could not tell whether Package Pipeline is running for $branch, so nothing was promoted: $(cat "$errors")"
              exit 1
            fi

            if [ "$running" != "0" ]; then
              echo "::error::Package Pipeline has a run for $branch that has not finished. Let it finish, or cancel it, before deploying."
              exit 1
            fi
          done

          # Fast-forward only. A merge would put a tree on the release branch that the matrix
          # never tested; a release branch that cannot fast-forward holds commits that did not
          # come through this gate, and must be reconciled by a person.
          if target_head=$(git rev-parse -q --verify "refs/remotes/origin/$TARGET"); then
            if ! git merge-base --is-ancestor "$target_head" "$TESTED_SHA"; then
              echo "::error::$TARGET has commits that $TESTED_SHA does not; it only ever moves forward to tested commits. Reconcile it before promoting."
              exit 1
            fi

            # A publish starts from the head of its release branch, and its release is the last
            # thing it creates. This channel's tag at the head with no release is a publish that
            # stopped part way, which moving the branch on would leave unable to finish.
            head_tags=$(git tag --list --points-at "$target_head" 'v*')

            for tag in $head_tags; do
              if [ "$CHANNEL" = "beta" ] && [[ "$tag" != *-beta ]]; then
                continue
              fi

              if [ "$CHANNEL" = "stable" ] && [[ "$tag" == *-beta ]]; then
                continue
              fi

              if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --silent 2>"$errors"; then
                continue
              fi

              if grep -q "HTTP 404" "$errors"; then
                echo "::error::$tag names the head of $TARGET but was never released, so its publish stopped part way. Start Package Pipeline for $TARGET again to finish it; to abandon a publish nuget.org never received, delete the tag."
              else
                echo "::error::Could not tell whether $tag was released, so nothing was promoted: $(cat "$errors")"
              fi
              exit 1
            done
          else
            echo "::notice::$TARGET does not exist yet; this promotion creates it."
          fi

          # Tags, not where the branches point, record what was published: a release branch moved
          # by hand publishes nothing, and Deploy promotes from wherever it was left.
          if [ "$CHANNEL" = "beta" ]; then
            released=$(git tag --list --contains "$TESTED_SHA" 'v*')

            if [ -n "$released" ]; then
              first=${released%%$'\n'*}
              echo "::error::$TESTED_SHA is already tagged as $first, so there is nothing new to publish. To finish a publish that stopped, start Package Pipeline for $TARGET again."
              exit 1
            fi

            exit 0
          fi

          # stable publishes only what beta already published: the beta tag of this version must
          # name exactly the commit being promoted, and its release must be published.
          version=$(dotnet run .github/scripts/version.cs read "$PROJECT")
          beta_tag="v${version}-beta"

          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "::error::v${version} is already tagged, so stable ${version} was published or its publish started. To finish a publish that stopped, start Package Pipeline for $TARGET again."
            exit 1
          fi

          if ! tagged=$(git rev-parse -q --verify "refs/tags/${beta_tag}^{commit}"); then
            echo "::error::${beta_tag} does not exist, so beta has not published ${version}. Deploy beta first; if its publish stopped before tagging, start Package Pipeline for ${SOURCE} again instead."
            exit 1
          fi

          if [ "$tagged" != "$TESTED_SHA" ]; then
            echo "::error::${beta_tag} names ${tagged}, not ${TESTED_SHA} at the head of ${SOURCE}; stable publishes only the commit beta published."
            exit 1
          fi

          # This endpoint answers for published releases only, and the release is the last thing a
          # publish creates.
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/${beta_tag}" --silent 2>"$errors"; then
            if grep -q "HTTP 404" "$errors"; then
              echo "::error::${beta_tag} is tagged but not released, so its publish did not finish. Start Package Pipeline for ${SOURCE} again first."
            else
              echo "::error::Could not tell whether ${beta_tag} was released, so nothing was promoted: $(cat "$errors")"
            fi
            exit 1
          fi

      - name: Bump the version on top of the tested commit
        if: inputs.channel == 'beta'
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version=$(dotnet run .github/scripts/version.cs bump "$PROJECT" "$REQUESTED_VERSION")

          if git diff --quiet -- "$PROJECT"; then
            echo "::error::The bump changed nothing; refusing a release that publishes nothing new."
            exit 1
          fi

          # pipeline-pkg would refuse a version already tagged, but only once main and
          # release/beta had moved. It is refused here, before anything is committed.
          for tag in "v${version}-beta" "v${version}"; do
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "::error::${tag} already exists, so ${version} was published before; pass a higher version."
              exit 1
            fi
          done

          git add "$PROJECT"
          git commit -m "v$version"
          echo "Version is now $version"

      - name: Mint the deploy app's token
        id: app-token
        # Minted once every check has passed, for the push alone.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DSS_DEPLOY_APP_ID }}
          private-key: ${{ secrets.DSS_DEPLOY_APP_PRIVATE_KEY }}
          # With no owner or repositories, the token reaches this repository alone. It asks for
          # contents alone: a promotion that changes workflow files needs the workflows
          # permission too, which docs/releasing.md covers under One-time setup.
          permission-contents: write

      - name: Promote
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          # For beta this is the bump on top of the tested commit; for stable, the tested commit.
          promoted=$(git rev-parse HEAD)

          # beta moves main and release/beta together or not at all. Nothing is forced: a branch
          # that moved to a commit the promotion does not contain rejects the whole push, and
          # nothing untested reaches either branch.
          if [ "$CHANNEL" = "beta" ]; then
            refs=("$promoted:refs/heads/main" "$promoted:refs/heads/$TARGET")
          else
            refs=("$promoted:refs/heads/$TARGET")
          fi

          # The token reaches git only through this one command's environment, as the header
          # actions/checkout would have written, and never through the working copy.
          basic=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)
          echo "::add-mask::$basic"

          if ! pushed=$(GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic" \
              git push --atomic origin "${refs[@]}" 2>&1); then
            echo "$pushed"

            # GitHub lets an app change workflow files only with the workflows permission, and a
            # promotion carries every workflow change made since the last one.
            if [[ "$pushed" == *"workflows"*"permission"* ]]; then
              echo "::error::GitHub refused the push because it changes workflow files, which the deploy app's token may do only with the workflows permission. Nothing was promoted; see docs/releasing.md, One-time setup."
            else
              echo "::error::The push failed. It was atomic: GitHub moves every branch in it or none."
            fi

            exit 1
          fi

          echo "$pushed"
          echo "PROMOTED_SHA=$promoted" >> "$GITHUB_ENV"
          echo "Promoted $SOURCE ($TESTED_SHA) to $TARGET as $promoted."

      - name: Start the package pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Started by dispatch, naming the exact commit promoted, which pipeline-pkg refuses to
          # substitute. A release branch moving publishes nothing by itself, so a stray push to
          # one can never ship.
          if ! gh workflow run pipeline-pkg.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$TARGET" \
              -f expected_sha="$PROMOTED_SHA"; then
            echo "::error::$TARGET was promoted to $PROMOTED_SHA, but Package Pipeline could not be started. Nothing is published until it runs: start it by hand for $TARGET."
            exit 1
          fi

          echo "Started pipeline-pkg for $TARGET at $PROMOTED_SHA."
